[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-audit"
version = "0.1.0"
description = "Audit transcripts for fillers, run-ons, false starts, and structure - so your spoken and dictated communication gets sharper over time"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=1.0"]

[project.scripts]
conversation-audit = "conversation_audit.cli:main"

[tool.setuptools.packages.find]
include = ["conversation_audit*"]
